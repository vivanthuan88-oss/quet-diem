<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét Điểm — chấm phiếu trắc nghiệm</title>
<meta name="description" content="Chấm phiếu trắc nghiệm giấy bằng camera điện thoại, chạy không cần mạng, dữ liệu nằm trong máy.">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quét Điểm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- QUÉT ĐIỂM · Tác giả: Vì Văn Thuân (GV Toán, PTDT Nội trú THCS&THPT Sốp Cộp) · có trợ lý AI hỗ trợ.
     Không gọi mạng; mọi dữ liệu lưu trong trình duyệt của máy đang dùng.
     Kèm sẵn 2 thư viện mã nguồn mở để tạo, đọc mã QR: qrcode-generator (MIT, Kazuhiko Arase) · jsQR (Apache-2.0, Cosmo Wolfe). -->
<style>
:root{
  --bg:#f3f4fb;--bg2:#e9ecfa;--card:#ffffffd9;--card2:#f6f7fd;--line:#dfe3f0;--text:#1b1e2e;--mu:#69708a;
  --pri:#7c5cff;--pri2:#22c7a9;--ok:#13a87f;--bad:#e5484d;--warn:#f5a524;
  --p1:#3b82f6;--p2:#d946ef;--p3:#f97316;--shadow:0 6px 24px rgba(40,44,80,.08);--r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12141f;--bg2:#181b2a;--card:#1d2133e6;--card2:#252a40;--line:#323852;--text:#eef0f8;--mu:#9aa1bb;--shadow:0 6px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);font-size:16px;line-height:1.45;
  background:radial-gradient(900px 500px at 0% -10%,#7c5cff26,transparent 60%),radial-gradient(800px 500px at 110% 10%,#22c7a926,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
a{color:var(--pri)}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2.sec{font-size:18px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 10px}
small{font-size:13px}
.mu{color:var(--mu)}.small{font-size:14px}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:#c77d00}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .logo{width:34px;height:34px}
.brand{font-weight:800;font-size:19px;letter-spacing:.02em;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sp{flex:1}
.top a.tl{font-size:14px;text-decoration:none;color:var(--mu);padding:6px 10px;border-radius:10px}
.top a.tl:hover{background:var(--card2)}
.demo-band{display:none;background:repeating-linear-gradient(45deg,#f5a524,#f5a524 12px,#ffc65a 12px,#ffc65a 24px);color:#2b1d00;text-align:center;font-weight:800;font-size:13px;padding:3px;letter-spacing:.08em}
body.demo .demo-band{display:block}
main{max-width:1000px;margin:0 auto;padding:16px}
main.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shot main.fade{animation:none}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.head h1{flex:1;min-width:160px}
.back{text-decoration:none;font-weight:600;color:var(--mu);width:100%;font-size:14px}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.row.gap{gap:10px}.row.end{justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.row.center{justify-content:center;margin:12px 0}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.np{padding:0;overflow:auto}
.card.tip{background:linear-gradient(135deg,#7c5cff14,#22c7a914)}
.card.warn{background:linear-gradient(135deg,#f5a5241f,#f5a52408);border-color:#f5a52466}
.card.bad{border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:14px;border:0;cursor:pointer;font:inherit;font-weight:650;text-decoration:none;
  color:#fff;background:linear-gradient(135deg,var(--pri),#5b6cff);box-shadow:0 4px 14px #7c5cff40;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #7c5cff50}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:20px;height:20px;fill:currentColor;stroke:currentColor}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.ghost.on{border-color:var(--pri);color:var(--pri);background:#7c5cff12}
.btn.danger{background:linear-gradient(135deg,#e5484d,#c2363b);box-shadow:0 4px 14px #e5484d40}
.btn.ghost.danger{background:transparent;color:var(--bad);border-color:#e5484d55;box-shadow:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.big{min-height:52px;font-size:17px;padding:0 22px}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
label{display:block;font-size:14px;font-weight:600;color:var(--mu);margin:0 0 12px}
label.inl{display:inline-flex;align-items:center;gap:8px;margin:0}
.lab{font-size:14px;font-weight:600;color:var(--mu);margin:4px 0 6px}
input,select,textarea{display:block;width:100%;margin-top:5px;font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
label.inl select,label.inl input{width:auto;margin:0}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #7c5cff66;border-color:var(--pri)}
input[type=checkbox]{width:20px;height:20px;min-height:0;display:inline-block;margin:0;accent-color:var(--pri)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chk{display:inline-flex;align-items:center;gap:8px;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:650;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:#13a87f1c;color:var(--ok);border-color:#13a87f44}
.chip.warn{background:#f5a5242a;color:#b06f00;border-color:#f5a52466}
.chip.big{font-size:15px;padding:6px 14px}
@media (prefers-color-scheme:dark){.chip.warn{color:#ffc65a}.warn-t{color:#ffc65a}}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-top:4px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--card2)}
/* trang chủ */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:center;margin:6px 0 16px}
.hero h1{font-size:34px;line-height:1.1;margin-bottom:8px}
.grad{background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:0 0 16px;font-size:17px}
.hero-art{width:100%;max-height:260px}
.hero-art .phone{animation:float 4s ease-in-out infinite}
.hero-art .scanline{animation:scan 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(118px)}}
.shot .hero-art .phone,.shot .hero-art .scanline{animation:none}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero h1{font-size:28px}.hero-art{max-height:190px;order:-1}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;box-shadow:var(--shadow)}
.kpi b{font-size:26px;line-height:1.1}
.kpi span{color:var(--mu);font-size:14px}
.kpi.warn b{color:#d48806}.kpi.okk b{color:var(--ok)}
.kpi .ring{width:46px;height:46px}
.kpis.sm .kpi b{font-size:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.step{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .12s}
.step:hover{transform:translateY(-2px)}
.step .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pri),#5b6cff);margin-bottom:4px}
.step.done .no{background:var(--ok)}
.step small{color:var(--mu)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:transform .12s}
.item:hover{transform:translateX(3px)}
.item small{display:block;color:var(--mu)}
.item .ring{width:46px;height:46px;flex:none}
.chev{font-size:24px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.ccard{position:relative;padding:18px;border-radius:var(--r);text-decoration:none;color:var(--text);background:linear-gradient(145deg,#7c5cff1f,#22c7a91a),var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:transform .12s}
.ccard:hover{transform:translateY(-3px)}
.cname{font-size:26px;font-weight:800}
.cmeta{display:flex;gap:12px;color:var(--mu);font-size:14px}
.empty{text-align:center;padding:30px 16px;color:var(--mu)}
.empty svg{width:150px;height:110px}
.empty h3{color:var(--text);font-size:19px;margin:8px 0 4px}
.empty p{max-width:480px;margin:0 auto 16px}
/* bảng */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{position:sticky;top:0;background:var(--card2);text-align:left;font-size:13px;color:var(--mu);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.total{font-weight:800;font-size:17px}
.tbl tr.soat td{background:#f5a52418}
.tbl tr.none td{color:var(--mu)}
.tbl tr.bad td{background:#e5484d12}
.tbl.res tbody tr[data-act]{cursor:pointer}
.tbl.res tbody tr[data-act]:hover td{background:#7c5cff10}
.tbl th.part1{color:var(--p1)}.tbl th.part2{color:var(--p2)}.tbl th.part3{color:var(--p3)}
.tbl.stu input{margin:0;min-height:38px;padding:7px 9px}
.tbl.mini th,.tbl.mini td{padding:4px 6px;font-size:12px}
.w4{max-width:70px}.w6{max-width:110px}.w8{max-width:140px;display:inline-block}.w2{width:28px;display:inline-block}
.x{border:0;background:transparent;color:var(--mu);font-size:24px;cursor:pointer;width:36px;height:36px;border-radius:10px}
.x:hover{background:#e5484d18;color:var(--bad)}
.scroll{max-height:55vh;overflow:auto;border-radius:12px;border:1px solid var(--line)}
/* tab */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;scrollbar-width:none}
.tabs a{flex:none;padding:9px 16px;border-radius:12px;text-decoration:none;color:var(--mu);font-weight:650;background:var(--card);border:1px solid var(--line)}
.tabs a.on{color:#fff;background:linear-gradient(135deg,var(--pri),#5b6cff);border-color:transparent}
/* phần màu */
.part1{--pc:var(--p1)}.part2{--pc:var(--p2)}.part3{--pc:var(--p3)}
label.part1,label.part2,label.part3{border-left:4px solid var(--pc);padding-left:10px}
.key .made{font-size:18px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.keys .card{margin:0}
.sum{margin-top:6px;padding:10px 12px;border-radius:12px;font-weight:600}
.sum.ok{background:#13a87f18;color:var(--ok)}.sum.bad{background:#e5484d14;color:var(--bad)}
.over{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.over label{margin:0}.over label.w2{grid-column:span 2}
.over input{min-height:38px;padding:7px 9px}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:8px 0;border-bottom:1px dashed var(--line)}
.hist time{display:block;font-size:12px;color:var(--mu)}
/* quét */
.scanbar{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.scanbar label{margin:0}
.count{text-align:center;padding:4px 10px}.count b{font-size:30px;color:var(--ok)}.count small{display:block;color:var(--mu)}
@media (max-width:560px){.scanbar{grid-template-columns:1fr 1fr}.count{grid-column:span 2}}
.cam{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2b3050,#10121c);box-shadow:var(--shadow)}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-corners i{position:absolute;width:42px;height:42px;border:4px solid #ffffffb0;opacity:.9}
.cam-corners i:nth-child(1){top:16px;left:16px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.cam-corners i:nth-child(2){top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.cam-corners i:nth-child(3){bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.cam-corners i:nth-child(4){bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.cam-hint{position:absolute;left:12px;right:12px;bottom:14px;padding:10px 14px;border-radius:14px;background:#000000a6;color:#fff;font-weight:650;text-align:center;font-size:15px}
.cam-hint.ok{background:#13a87fe0}.cam-hint.warn{background:#d48806e6}
.cam-flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.cam-flash.ok{background:#13a87f}.cam-flash.soat{background:#f5a524}
.cam-flash.go{animation:flash .6s ease}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.scanres{display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.rescard{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--text);animation:pop .35s ease}
.rescard small{display:block;color:var(--mu)}
.rescard.ok{border-left:6px solid var(--ok)}.rescard.soat{border-left:6px solid var(--warn)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.sc{min-width:58px;height:48px;padding:0 6px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--ok),#22c7a9)}
.rescard.soat .sc,.sc.sm{background:linear-gradient(135deg,#f5a524,#e08a00)}
.sc.sm{min-width:48px;height:40px;font-size:16px}
/* phiếu */
.sheetwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;align-items:start}
@media (max-width:820px){.sheetwrap{grid-template-columns:1fr}}
.sheetimg{position:sticky;top:76px}
.sheetimg canvas{width:100%;height:auto;border-radius:12px;background:#fff;box-shadow:var(--shadow);border:1px solid var(--line)}
@media (max-width:820px){.sheetimg{position:static}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:8px 0;color:var(--mu)}
.lg::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;margin-right:5px;vertical-align:-2px}
.lg.ok::before{border-color:#13a87f}.lg.bad::before{border-color:#e5484d}.lg.key::before{border-color:#13a87f;border-style:dashed}.lg.warn::before{border-color:#f5a524;border-radius:3px}
.scorebox{display:flex;align-items:center;gap:16px}
.scorebox .big{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--ok),#22c7a9);-webkit-background-clip:text;background-clip:text;color:transparent}
.parts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-weight:700}
.parts span{color:var(--pc)}
.fix{padding:10px 0;border-top:1px dashed #f5a52466}
.fix:first-of-type{border-top:0}
.ft{font-weight:650;margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.opts input{margin:0;min-height:40px}
.opt{min-width:44px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.opt:hover{border-color:var(--pri);color:var(--pri)}
.opt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ghost{font-weight:600;color:var(--mu)}
/* thống kê */
.chart{width:100%;height:auto}
.chart .ax{font-size:12px;fill:var(--mu)}
.chart .val{font-size:12px;font-weight:700;fill:var(--text)}
.chart .lab{font-size:15px;font-weight:700;fill:var(--text)}
.rbar{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:6px 0 10px;background:var(--line)}
.rbar span{display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.rleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.rleg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.cmpr{display:grid;grid-template-columns:60px 1fr;align-items:center;gap:8px}
.pbars,.mbars{display:flex;flex-direction:column;gap:12px}
.pbar{display:grid;grid-template-columns:80px 1fr;gap:4px 12px;align-items:center}
.pbar b{color:var(--pc)}.pbar em{grid-column:2;font-style:normal;color:var(--mu);font-size:14px}
.track{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.track span{display:block;height:100%;border-radius:99px;background:var(--pc,var(--pri))}
.mbars>div{display:grid;grid-template-columns:56px 1fr 130px;gap:10px;align-items:center}
.mbars em{font-style:normal;font-size:14px;color:var(--mu)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:10px}
.itc{padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);border-top:4px solid var(--pc)}
.itc.p1{--pc:var(--p1)}.itc.p2{--pc:var(--p2)}.itc.p3{--pc:var(--p3)}
.itc .track{height:8px;margin:6px 0 8px}
.track.ok span{background:var(--ok)}.track.warn span{background:var(--warn)}.track.bad span{background:var(--bad)}
.rate{font-weight:900;font-size:18px}.rate.ok{color:var(--ok)}.rate.warn{color:#d48806}.rate.bad{color:var(--bad)}
.opts4{display:flex;gap:6px;align-items:flex-end;height:64px;margin:4px 0}
.opts4 span{flex:1;position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px}
.opts4 i{display:block;width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:#9aa3bd88}
.opts4 span.k i{background:var(--ok)}
.opts4 span.e i{background:#c8ccd9}
.opts4 b{font-size:13px}.opts4 small{color:var(--mu);font-size:11px}
.disc{font-size:13px;margin-top:6px;font-weight:600}
.disc.ok{color:var(--ok)}.disc.warn{color:#c77d00}.disc.bad{color:var(--bad)}.disc.mu{color:var(--mu)}
.plist{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.plist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
details summary{cursor:pointer;font-weight:600}
/* hướng dẫn */
.hstep{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hstep .hart svg{width:120px;height:90px}
.hstep .no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;margin-right:8px}
.hstep h3{display:inline}
.hstep p{margin:8px 0 0}
@media (max-width:560px){.hstep{grid-template-columns:1fr}.hstep .hart svg{width:100px;height:72px}}
.dots{margin:0;padding-left:20px}.dots li{margin:6px 0}
.credit{display:flex;gap:14px;align-items:center}.credit .logo{width:48px;height:48px;flex:none}
/* điều hướng dưới */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:var(--mu);font-size:12px;font-weight:650}
.nav a svg{width:24px;height:24px;fill:currentColor;stroke:currentColor}
.nav a.on{color:var(--pri);background:#7c5cff14}
.nav a.scan{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-top:-18px;border-radius:20px;box-shadow:0 6px 18px #7c5cff55;max-width:86px;padding:10px 2px}
/* hộp thoại, thông báo */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#0b0d1799;padding:12px}
#modal.show{display:flex;animation:fade .2s}
.modal-card{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px #0006}
.modal-card.wide{max-width:760px}
@media (min-width:700px){#modal{align-items:center}}
.mbody{margin-bottom:6px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,480px)}
.toast{padding:12px 16px;border-radius:14px;background:#1d2133;color:#fff;font-weight:600;box-shadow:0 10px 30px #0005;animation:pop .25s;transition:opacity .4s}
.toast.ok{background:#0f8f6b}.toast.warn{background:#b97300}.toast.bad{background:#c2363b}
.toast.out{opacity:0}
/* in */
.paper{background:#fff;color:#000;margin:0 auto;max-width:794px;box-shadow:var(--shadow);border-radius:4px}
.paper svg{display:block;width:100%;height:auto}
.sheet-list{padding:28px}
.sheet-list h2{text-align:center;font-size:20px;margin:0 0 6px}.sheet-list p{text-align:center;margin:0 0 14px}
.sheet-list .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tbl.sbd{color:#000}.tbl.sbd th{background:#eee;color:#000;position:static}.tbl.sbd td{border-bottom:1px solid #999;padding:5px 8px}.tbl.sbd .big{font-size:18px;font-weight:800}
@page{size:A4;margin:0}
@media print{
  body{background:#fff!important;padding:0}
  .top,.nav,.noprint,#toasts,#modal,.demo-band{display:none!important}
  main{padding:0;max-width:none}
  .paper{box-shadow:none;max-width:none;border-radius:0}
  .paper svg{width:210mm;height:297mm}
  .sheet-list{padding:12mm}
}
@media (max-width:560px){.row.wrap>h3.grow{flex-basis:100%}.mbars>div{grid-template-columns:50px 1fr;}.mbars em{grid-column:2}}
/* mã QR chuyển lớp, đáp án */
.qr-show{background:#fff;border-radius:16px;padding:8px;margin:10px auto;width:min(100%,420px,52vh);aspect-ratio:1}
.qr-show svg{display:block;width:100%;height:100%}
.qr-cam{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:62vh;margin:8px auto;width:100%}
.qr-cam video{width:100%;height:100%;object-fit:cover;display:block}
.qr-aim{position:absolute;inset:16% 12%;border:3px solid #ffffffcc;border-radius:18px;box-shadow:0 0 0 2000px #0006}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;

      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {

          }

      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;

  APP.ACT.pasteList = function (el) {
    APP.modal(`<h3>Dán danh sách từ Excel</h3>
      <p>Bôi đen các cột trong Excel rồi dán vào ô dưới. App tự nhận cột: <b>số thứ tự</b>, <b>số báo danh</b>, <b>mã HS hoặc họ tên</b>.</p>
      <textarea id="mPaste" rows="9" placeholder="1	HS01	01&#10;2	HS02	02&#10;3	HS03	03"></textarea>

      <div class="row end"><button class="btn ghost" data-act="closeModal">Thôi</button><button class="btn" data-act="doPaste" data-id="${el.dataset.id}">Nhận danh sách</button></div>`, { wide: true });
  };
  /* Đoán cột: số thứ tự / số báo danh / nhãn */
  APP.parseList = function (text, sbdLen) {
    const lines = text.replace(/\r/g, '').split('\n').map(l => l.split(/\t|;|,(?=\S)/).map(x => x.trim())).filter(r => r.some(Boolean));
    if (!lines.length) return [];
    if (lines[0].every(x => !/^\d+$/.test(x)) && lines.length > 1) lines.shift(); // dòng tiêu đề
    const nc = Math.max(...lines.map(r => r.length));
    const kind = [];
    for (let j = 0; j < nc; j++) {
      const col = lines.map(r => r[j] || '');
      const nums = col.filter(v => /^\d+$/.test(v)).length;
      kind.push(nums >= col.length * 0.8 ? 'num' : 'txt');
    }
    const numCols = kind.map((k, j) => k === 'num' ? j : -1).filter(j => j >= 0);
    let sttCol = -1, sbdCol = -1;
    if (numCols.length >= 2) {
      // cột tăng 1,2,3… là số thứ tự; cột còn lại là số báo danh
      const seq = numCols.find(j => lines.every((r, i) => parseInt(r[j], 10) === i + 1));
      sttCol = seq != null ? seq : numCols[0];
      sbdCol = numCols.find(j => j !== sttCol);
    } else if (numCols.length === 1) {
      const j = numCols[0];
      const zeroPad = lines.some(r => /^0\d/.test(r[j] || ''));
      if (zeroPad) sbdCol = j; else sttCol = j;
    }
    const txtCols = kind.map((k, j) => k === 'txt' ? j : -1).filter(j => j >= 0);
    return lines.map((r, i) => {
      const stt = sttCol >= 0 ? parseInt(r[sttCol], 10) || i + 1 : i + 1;
      let sbd = sbdCol >= 0 ? (r[sbdCol] || '').replace(/\D/g, '') : '';
      if (sbd && sbd.length < sbdLen) sbd = sbd.padStart(sbdLen, '0');
      const label = txtCols.map(j => r[j]).filter(Boolean).join(' ');
      return { stt, sbd, label: label || ('HS' + String(stt).padStart(2, '0')) };
    });
  };
  APP.applyList = function (c, list, add) {

    APP.checkNames(c);
  };

      <div class="row gap">${['p1', 'p2', 'p3'].map((k, i) => `<label class="grow part${i + 1}">Phần ${['I', 'II', 'III'][i]} <small class="mu">(tối đa ${QD.MAX[k]})</small><input inputmode="numeric" value="${t.counts[k]}" data-ch="tCount" data-id="${t.id}" data-k="${k}"></label>`).join('')}</div>
      <div class="lab">Lớp làm bài</div><div class="checks">${S.classes.map(c => `<label class="chk"><input type="checkbox" ${t.classIds.includes(c.id) ? 'checked' : ''} data-ch="tCls" data-id="${t.id}" value="${c.id}"> ${esc(c.name)} <small class="mu">(${c.students.length} HS)</small></label>`).join('')}</div>
      </div><div class="row end"><button class="btn ghost danger" data-act="delTest" data-id="${t.id}">Xoá bài</button></div>`;
  };
  APP.CH.tName = function (el) { const t = APP.test(el.dataset.id); t.name = el.value.trim() || t.name; APP.save(); };
  APP.CH.tCount = function (el) {
    const t = APP.test(el.dataset.id), k = el.dataset.k;
    let v = parseInt(el.value, 10) || 0;
    v = Math.max(0, Math.min(QD.MAX[k], v));
    const old = t.counts[k];
    if (old === v) { el.value = v; return; }
    t.counts[k] = v; t.changedAt = Date.now();
    t.hist.push({ t: Date.now(), text: `Đổi số câu Phần ${{ p1: 'I', p2: 'II', p3: 'III' }[k]}: ${old} → ${v}` });
    APP.save(); APP.render(); APP.toast('Đã đổi số câu. Điểm tự chấm lại. Phiếu in trước đó vẫn dùng được nếu có đủ dòng.', '');
  };
  APP.CH.tCls = function (el) {
    const t = APP.test(el.dataset.id);
    if (el.checked) { if (!t.classIds.includes(el.value)) t.classIds.push(el.value); }
    else {
      const n = APP.ST.sheets.filter(s => s.testId === t.id && s.classId === el.value).length;
      if (n) { el.checked = true; APP.toast('Lớp này đã có ' + n + ' phiếu trong bài, không bỏ được. Muốn bỏ thì xoá phiếu trước.', 'warn'); return; }
      t.classIds = t.classIds.filter(x => x !== el.value);
    }
    APP.save();
  };
  APP.ACT.delTest = function (el) {
    const t = APP.test(el.dataset.id), n = APP.ST.sheets.filter(s => s.testId === t.id).length;
    APP.confirm('Xoá bài «' + esc(t.name) + '»?', `Xoá đáp án${n ? ` và <b>${n} phiếu đã quét</b>` : ''}. Không lấy lại được (trừ khi có tệp sao lưu).`, 'Xoá bài', () => {
      APP.ST.sheets.filter(s => s.testId === t.id).forEach(s => DB.del('img', s.id));
      APP.ST.sheets = APP.ST.sheets.filter(s => s.testId !== t.id);
      APP.ST.tests = APP.ST.tests.filter(x => x.id !== t.id);
      APP.save(); APP.go('bai');
    }, true);
  };

  /* ---------- đáp án ---------- */
  APP.keyText = function (k) {
    return { p1: (k.p1 || ''), p2: (k.p2 || []).join(' '), p3: (k.p3 || []).join('; ') };
  };
  APP.parseKey = function (txt, counts) {
    const errs = [];
    const p1 = String(txt.p1 || '').toUpperCase().replace(/[\s,;.\-0-9]+/g, '');
    if (/[^ABCD]/.test(p1)) errs.push('Phần I chỉ được có A, B, C, D');
    if (counts.p1 && p1.length !== counts.p1) errs.push(`Phần I có ${p1.length}/${counts.p1} câu`);
    let g = String(txt.p2 || '').trim().split(/[\s;,|]+/).filter(Boolean);
    if (g.length === 1 && g[0].length === 4 * counts.p2 && counts.p2 > 1) g = g[0].match(/.{4}/g);
    const p2 = g.map(x => Array.from(x).map(QD.normDS).join(''));
    g.forEach((x, i) => { if (Array.from(x).map(QD.normDS).some(c => !c) || Array.from(x).length !== 4) errs.push(`Phần II câu ${i + 1} phải đủ 4 ý Đ/S`); });
    if (counts.p2 && p2.length !== counts.p2) errs.push(`Phần II có ${p2.length}/${counts.p2} câu`);
    const p3 = String(txt.p3 || '').split(';').map(x => x.trim()).filter((x, i, a) => x !== '' || i < a.length - 1);
    while (p3.length && p3[p3.length - 1] === '') p3.pop();
    p3.forEach((x, i) => { if (!x) errs.push(`Phần III câu ${i + 1} chưa có đáp án`); });
    if (counts.p3 && p3.length !== counts.p3) errs.push(`Phần III có ${p3.length}/${counts.p3} câu`);
    return { key: { p1, p2, p3 }, errs };
  };
  APP.tabKeys = function (t) {
    const ms = Object.keys(t.keys).sort();
    let h = `<div class="card tip small">Gõ nhanh: <b>Phần I</b> «ABCDDCBA…» · <b>Phần II</b> mỗi câu 4 chữ Đ/S cách nhau dấu cách «ĐSĐĐ SSĐS…» (gõ D thay Đ cũng được) · <b>Phần III</b> các đáp án cách nhau dấu chấm phẩy «1,5; -2; 0,25». Câu Phần III nhận nhiều đáp án: ngăn bằng dấu | «1,5|1,6».</div>
      <div class="row wrap gap"><button class="btn" data-act="addMade" data-id="${t.id}">+ Thêm mã đề</button><button class="btn ghost" data-act="pasteKeys" data-id="${t.id}">📋 Dán bảng đáp án từ Excel</button><button class="btn ghost" data-act="pasteGoc" data-id="${t.id}">🔀 Bảng câu gốc ${t.goc ? '(đã có)' : '(tuỳ chọn)'}</button>${t.undo ? `<button class="btn ghost" data-act="undoKeys" data-id="${t.id}">↩ Hoàn tác lần sửa đáp án</button>` : ''}</div>`;
    if (!ms.length) return h + APP.empty('Chưa có mã đề nào', 'Thêm từng mã đề (4 chữ số, VD 1201), hoặc dán cả bảng đáp án từ Excel: mỗi dòng một mã đề, mỗi cột một câu. Tối đa 24 mã đề.', `<button class="btn" data-act="addMade" data-id="${t.id}">+ Thêm mã đề</button>`);
    h += `<div class="keys">`;
    ms.forEach(m => {
      const k = t.keys[m], tx = APP.keyText(k), chk = APP.parseKey(tx, t.counts);
      h += `<div class="card key ${chk.errs.length ? 'bad' : ''}"><div class="row"><b class="made">Mã ${esc(m)}</b><span class="grow"></span>${chk.errs.length ? `<span class="chip warn">${chk.errs.length} lỗi</span>` : '<span class="chip ok">đủ đáp án</span>'}<button class="x" data-act="delMade" data-id="${t.id}" data-m="${m}" title="Xoá mã đề">×</button></div>
        ${t.counts.p1 ? `<label class="part1">Phần I (${t.counts.p1} câu)<input class="mono" value="${esc(tx.p1)}" data-ch="keyEdit" data-id="${t.id}" data-m="${m}" data-k="p1" autocapitalize="characters"></label>` : ''}
        ${t.counts.p2 ? `<label class="part2">Phần II (${t.counts.p2} câu)<input class="mono" value="${esc(tx.p2)}" data-ch="keyEdit" data-id="${t.id}" data-m="${m}" data-k="p2" autocapitalize="characters"></label>` : ''}
        ${t.counts.p3 ? `<label class="part3">Phần III (${t.counts.p3} câu)<input class="mono" value="${esc(tx.p3)}" data-ch="keyEdit" data-id="${t.id}" data-m="${m}" data-k="p3"></label>` : ''}
        ${chk.errs.length ? `<div class="err">${chk.errs.join(' · ')}</div>` : ''}</div>`;
    });
    return h + `</div>`;
  };
  /* Đổi đáp án → chấm lại cả bài, báo ai đổi điểm */
  APP.allGrades = function (t) {
    const m = {};
    APP.ST.sheets.filter(s => s.testId === t.id).forEach(s => { const x = APP.sheetInfo(s); if (x) m[s.id] = x.g.ok ? x.g.total : null; });
    return m;
  };
  APP.commitKeys = function (t, newKeys, newGoc, what) {
    const before = APP.allGrades(t);
    t.undo = { keys: JSON.parse(JSON.stringify(t.keys)), goc: t.goc ? JSON.parse(JSON.stringify(t.goc)) : null, t: Date.now(), what };
    t.keys = newKeys;
    if (newGoc !== undefined) t.goc = newGoc;
    const after = APP.allGrades(t), changed = [];
    Object.keys(after).forEach(id => { if (before[id] !== after[id]) changed.push({ id, a: before[id], b: after[id] }); });
    t.changedAt = Date.now();
    t.hist.push({ t: Date.now(), text: what + (changed.length ? ` — chấm lại, ${changed.length} phiếu đổi điểm` : '') });
    APP.save();
    APP.render();
    if (changed.length) APP.showChanged(t, changed, 'Đã chấm lại theo đáp án mới');
    else if (Object.keys(after).length) APP.toast('Đã lưu. Chấm lại ' + Object.keys(after).length + ' phiếu, không em nào đổi điểm.', 'ok');
  };
  APP.showChanged = function (t, changed, title) {
    const rows = changed.slice(0, 60).map(c => {
      const sh = APP.ST.sheets.find(s => s.id === c.id), x = sh && APP.sheetInfo(sh);
      return `<tr><td>${esc(x ? x.cls.name : '')}</td><td>${esc(x && x.st ? x.st.label : (x ? x.eff.sbdStr || '?' : ''))}</td><td class="num">${APP.fmt(c.a)}</td><td>→</td><td class="num"><b>${APP.fmt(c.b)}</b></td></tr>`;
    }).join('');
    APP.modal(`<h3>${title}</h3><p><b>${changed.length}</b> phiếu đổi điểm${t.exportedAt ? ' · <span class="warn-t">Thầy cô đã xuất điểm trước đó, nhớ <b>xuất lại</b>.</span>' : ''}</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>Lớp</th><th>Học sinh</th><th>Điểm cũ</th><th></th><th>Điểm mới</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="row end">${t.undo ? `<button class="btn ghost" data-act="undoKeys" data-id="${t.id}">↩ Hoàn tác</button>` : ''}<button class="btn" data-act="closeModal">Đồng ý</button></div>`, { wide: true, focus: false });
  };
  APP.CH.keyEdit = function (el) {
    const t = APP.test(el.dataset.id), m = el.dataset.m, k = el.dataset.k;
    const tx = APP.keyText(t.keys[m]);
    tx[k] = el.value;
    const r = APP.parseKey(tx, t.counts);
    const nk = JSON.parse(JSON.stringify(t.keys));
    nk[m] = r.key;
    if (JSON.stringify(nk[m]) === JSON.stringify(t.keys[m])) return;
    APP.commitKeys(t, nk, undefined, `Sửa đáp án mã ${m}, Phần ${{ p1: 'I', p2: 'II', p3: 'III' }[k]}`);
  };
  APP.ACT.undoKeys = function (el) {
    const t = APP.test(el.dataset.id);
    if (!t.undo) return;
    const u = t.undo, before = APP.allGrades(t);
    t.keys = u.keys; t.goc = u.goc; t.undo = null;
    const after = APP.allGrades(t), n = Object.keys(after).filter(id => before[id] !== after[id]).length;
    t.changedAt = Date.now();
    t.hist.push({ t: Date.now(), text: 'Hoàn tác: ' + u.what + (n ? ` — ${n} phiếu trở lại điểm cũ` : '') });
    APP.save(); APP.closeModal(); APP.render(); APP.toast('Đã hoàn tác lần sửa đáp án', 'ok');
  };
  APP.ACT.addMade = function (el) {
    const t = APP.test(el.dataset.id);
    if (Object.keys(t.keys).length >= 24) { APP.toast('Tối đa 24 mã đề', 'warn'); return; }
    APP.modal(`<h3>Thêm mã đề</h3><label>Mã đề (4 chữ số)<input id="mMade" inputmode="numeric" maxlength="4" placeholder="VD 1201"></label>
      ${t.counts.p1 ? `<label class="part1">Phần I (${t.counts.p1} câu)<input id="mK1" class="mono" placeholder="ABCD…" autocapitalize="characters"></label>` : ''}
      ${t.counts.p2 ? `<label class="part2">Phần II (${t.counts.p2} câu, mỗi câu 4 chữ Đ/S)<input id="mK2" class="mono" placeholder="ĐSĐĐ SSĐS …" autocapitalize="characters"></label>` : ''}
      ${t.counts.p3 ? `<label class="part3">Phần III (${t.counts.p3} câu, cách nhau dấu ;)<input id="mK3" class="mono" placeholder="1,5; -2; 0,25 …"></label>` : ''}
      <div class="row end"><button class="btn ghost" data-act="closeModal">Thôi</button><button class="btn" data-act="saveMade" data-id="${t.id}">Thêm</button></div>`);
  };
  APP.ACT.saveMade = function (el) {
    const t = APP.test(el.dataset.id), m = $('#mMade').value.trim();
    if (!/^\d{4}$/.test(m)) { APP.toast('Mã đề phải đủ 4 chữ số', 'warn'); return; }
    if (t.keys[m]) { APP.toast('Mã đề ' + m + ' đã có rồi', 'warn'); return; }
    const r = APP.parseKey({ p1: ($('#mK1') || {}).value, p2: ($('#mK2') || {}).value, p3: ($('#mK3') || {}).value }, t.counts);
    const nk = JSON.parse(JSON.stringify(t.keys)); nk[m] = r.key;
    APP.closeModal();
    APP.commitKeys(t, nk, undefined, 'Thêm mã đề ' + m);
    if (r.errs.length) APP.toast('Mã ' + m + ': ' + r.errs.join(' · '), 'warn');
  };
  APP.ACT.delMade = function (el) {
    const t = APP.test(el.dataset.id), m = el.dataset.m;
    const n = APP.ST.sheets.filter(s => s.testId === t.id).map(APP.sheetInfo).filter(x => x && x.eff.madeStr === m).length;
    APP.confirm('Xoá mã đề ' + m + '?', n ? `Có <b>${n} phiếu</b> đang làm mã này — xoá xong các phiếu đó sẽ chờ soát.` : 'Xoá đáp án của mã đề này.', 'Xoá mã đề', () => {
      const nk = JSON.parse(JSON.stringify(t.keys)); delete nk[m];
      const ng = t.goc ? JSON.parse(JSON.stringify(t.goc)) : null; if (ng) delete ng[m];
      APP.commitKeys(t, nk, ng, 'Xoá mã đề ' + m);
    }, true);
  };
  APP.ACT.pasteKeys = function (el) {
    const t = APP.test(el.dataset.id), c = t.counts;
    const cols = ['Mã đề'].concat(Array.from({ length: c.p1 }, (_, i) => 'I.' + (i + 1)), Array.from({ length: c.p2 }, (_, i) => 'II.' + (i + 1)), Array.from({ length: c.p3 }, (_, i) => 'III.' + (i + 1)));
    APP.modal(`<h3>Dán bảng đáp án từ Excel</h3><p>Mỗi dòng một mã đề. Các cột theo thứ tự:</p><div class="scroll"><table class="tbl mini"><tr>${cols.map(x => `<th>${x}</th>`).join('')}</tr><tr>${cols.map((x, i) => `<td class="mu">${i === 0 ? '1201' : x.startsWith('III') ? '1,5' : x.startsWith('II') ? 'ĐSĐS' : 'A'}</td>`).join('')}</tr></table></div>
      <p class="mu small">Dòng tiêu đề (nếu có) sẽ được bỏ qua. Mã đề đã có sẽ được thay bằng đáp án mới.</p>
      <textarea id="mKeys" rows="8"></textarea>
      <div class="row end"><button class="btn ghost" data-act="closeModal">Thôi</button><button class="btn" data-act="doPasteKeys" data-id="${t.id}">Nhận bảng đáp án</button></div>`, { wide: true });
  };
  APP.splitRows = text => text.replace(/\r/g, '').split('\n').map(l => l.split('\t').map(x => x.trim())).filter(r => r.some(Boolean));
  APP.ACT.doPasteKeys = function (el) {
    const t = APP.test(el.dataset.id), c = t.counts, rows = APP.splitRows($('#mKeys').value);
    const nk = JSON.parse(JSON.stringify(t.keys)), errs = [];
    let n = 0;
    rows.forEach((r, ri) => {
      const m = (r[0] || '').replace(/\D/g, '');
      if (!/^\d{4}$/.test(m)) { if (ri > 0 || /\d/.test(r[0] || '')) errs.push('dòng ' + (ri + 1) + ': mã đề phải 4 chữ số'); return; }
      let cells = r.slice(1);
      if (cells.length === 1 && c.p1 > 1) cells = Array.from(cells[0].replace(/\s/g, ''));   // dán cả chuỗi ABCD trong một ô
      const p1 = cells.slice(0, c.p1).join(''), p2 = cells.slice(c.p1, c.p1 + c.p2).join(' '), p3 = cells.slice(c.p1 + c.p2, c.p1 + c.p2 + c.p3).join(';');
      const k = APP.parseKey({ p1, p2, p3 }, c);
      if (k.errs.length) errs.push('mã ' + m + ': ' + k.errs.join(', '));
      nk[m] = k.key; n++;
    });
    if (!n) { APP.toast('Không đọc được dòng nào. Mỗi dòng phải bắt đầu bằng mã đề 4 chữ số.', 'warn'); return; }
    if (Object.keys(nk).length > 24) { APP.toast('Quá 24 mã đề', 'warn'); return; }
    APP.closeModal();
    APP.commitKeys(t, nk, undefined, 'Dán bảng đáp án (' + n + ' mã đề)');
    if (errs.length) APP.toast('Cần xem lại: ' + errs.slice(0, 4).join(' · '), 'warn');
  };
  APP.ACT.pasteGoc = function (el) {
    const t = APP.test(el.dataset.id), c = t.counts;
    APP.modal(`<h3>Bảng câu gốc (khi đề đã trộn)</h3><p>Mỗi dòng một mã đề. Sau mã đề là <b>số thứ tự câu gốc</b> của từng câu, theo thứ tự Phần I (${c.p1} cột), Phần II (${c.p2} cột), Phần III (${c.p3} cột). VD câu 1 của mã 1202 là câu 5 của đề gốc thì cột I.1 ghi 5.</p>
      <p class="mu small">Có bảng này: thống kê gộp được theo câu gốc cho mọi mã đề; điểm riêng từng câu đặt theo câu gốc.</p>
      <textarea id="mGoc" rows="8" placeholder="1201	1	2	3	…&#10;1202	5	1	7	…"></textarea>
      <div class="row end">${t.goc ? `<button class="btn ghost danger" data-act="clearGoc" data-id="${t.id}">Bỏ bảng câu gốc</button>` : ''}<button class="btn ghost" data-act="closeModal">Thôi</button><button class="btn" data-act="doPasteGoc" data-id="${t.id}">Nhận bảng</button></div>`, { wide: true });
  };
  APP.ACT.doPasteGoc = function (el) {
    const t = APP.test(el.dataset.id), c = t.counts, rows = APP.splitRows($('#mGoc').value), g = {}, errs = [];
    rows.forEach(r => {
      const m = (r[0] || '').replace(/\D/g, '');
      if (!/^\d{4}$/.test(m)) return;
      const nums = r.slice(1).map(x => parseInt(x, 10));
      const parts = { p1: nums.slice(0, c.p1), p2: nums.slice(c.p1, c.p1 + c.p2), p3: nums.slice(c.p1 + c.p2, c.p1 + c.p2 + c.p3) };
      ['p1', 'p2', 'p3'].forEach(k => {
        const a = parts[k], need = c[k];
        const okPerm = a.length === need && a.every(v => v >= 1 && v <= need) && new Set(a).size === need;
        if (!okPerm && need) errs.push(`mã ${m} Phần ${{ p1: 'I', p2: 'II', p3: 'III' }[k]}`);
      });
      g[m] = parts;
    });
    if (!Object.keys(g).length) { APP.toast('Không đọc được dòng nào', 'warn'); return; }
    if (errs.length) { APP.toast('Số câu gốc chưa đủ hoặc bị trùng ở: ' + errs.slice(0, 4).join(', '), 'warn'); return; }
    APP.closeModal();
    APP.commitKeys(t, t.keys, g, 'Nhập bảng câu gốc (' + Object.keys(g).length + ' mã đề)');
  };
  APP.ACT.clearGoc = function (el) { const t = APP.test(el.dataset.id); APP.closeModal(); APP.commitKeys(t, t.keys, null, 'Bỏ bảng câu gốc'); };

  /* ---------- thang điểm ---------- */
  APP.tabScore = function (t) {
    const sc = t.scoring, ms = Object.keys(t.keys).sort(), m0 = ms[0] || '';
    const mr = QD.maxRaw(t, m0);
    const warn = sc.mode === 'cong' && Math.abs(mr - sc.scale) > 1e-6;
    const ov = (part, i) => { const o = sc.over[part + '-' + i]; return o == null ? '' : (part === 'p2' ? o.map(x => APP.fmt(x, 3)).join(' ') : APP.fmt(o, 3)); };
    let h = `<div class="card"><div class="grid2">
      <label>Thang điểm của bài<select data-ch="scScale" data-id="${t.id}">${[10, 100].map(v => `<option value="${v}" ${sc.scale === v ? 'selected' : ''}>Thang ${v}</option>`).join('')}<option value="khac" ${[10, 100].includes(sc.scale) ? '' : 'selected'}>Số khác…</option></select></label>
      ${[10, 100].includes(sc.scale) ? '' : `<label>Thang (tự gõ)<input inputmode="decimal" value="${APP.fmt(sc.scale, 3)}" data-ch="scScaleN" data-id="${t.id}"></label>`}
      <label>Cách tính<select data-ch="scMode" data-id="${t.id}"><option value="cong" ${sc.mode === 'cong' ? 'selected' : ''}>Cộng điểm từng câu</option><option value="quy" ${sc.mode === 'quy' ? 'selected' : ''}>Quy về thang điểm</option></select></label>
      <label>Làm tròn<select data-ch="scRound" data-id="${t.id}">${[[0.01, '0,01'], [0.05, '0,05'], [0.1, '0,1'], [0.25, '0,25'], [0.5, '0,5'], [1, 'số nguyên'], [0, 'không làm tròn']].map(([v, l]) => `<option value="${v}" ${Number(sc.round) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
      <div class="sum ${warn ? 'bad' : 'ok'}">Điểm tối đa của bài: <b>${APP.fmt(mr, 3)}</b>${sc.mode === 'quy' ? ` → quy về thang <b>${APP.fmt(sc.scale)}</b>` : (warn ? ` · <b>không bằng thang ${APP.fmt(sc.scale)}</b> — sửa điểm từng câu hoặc chọn «Quy về thang điểm»` : ` = thang ${APP.fmt(sc.scale)} ✓`)}</div></div>
      <div class="card"><h3>Điểm mặc định từng phần</h3><div class="grid3">
      ${t.counts.p1 ? `<label class="part1">Phần I · mỗi câu đúng<input inputmode="decimal" value="${APP.fmt(sc.p1, 3)}" data-ch="scDef" data-id="${t.id}" data-k="p1"></label>` : ''}
      ${t.counts.p2 ? `<label class="part2">Phần II · đúng 1 / 2 / 3 / 4 ý<input inputmode="decimal" value="${sc.p2.map(x => APP.fmt(x, 3)).join(' ')}" data-ch="scDef" data-id="${t.id}" data-k="p2"></label>` : ''}
      ${t.counts.p3 ? `<label class="part3">Phần III · mỗi câu đúng<input inputmode="decimal" value="${APP.fmt(sc.p3, 3)}" data-ch="scDef" data-id="${t.id}" data-k="p3"></label>` : ''}
      </div><p class="mu small">Mẫu theo cách chấm đề thi tốt nghiệp môn Toán: Phần I 0,25 · Phần II 0,1 / 0,25 / 0,5 / 1 · Phần III 0,5. Thầy cô soát lại cho đúng đề của mình.</p></div>
      <div class="card"><h3>Điểm riêng từng câu <small class="mu">(để trống = dùng điểm mặc định${t.goc ? ' · theo câu gốc' : ''})</small></h3><div class="over">`;
    for (let i = 0; i < t.counts.p1; i++) h += `<label class="part1">I.${i + 1}<input inputmode="decimal" placeholder="${APP.fmt(sc.p1, 3)}" value="${ov('p1', i)}" data-ch="scOver" data-id="${t.id}" data-k="p1-${i}"></label>`;
    for (let i = 0; i < t.counts.p2; i++) h += `<label class="part2 w2">II.${i + 1} <small>(1/2/3/4 ý)</small><input inputmode="decimal" placeholder="${sc.p2.map(x => APP.fmt(x, 3)).join(' ')}" value="${ov('p2', i)}" data-ch="scOver" data-id="${t.id}" data-k="p2-${i}"></label>`;
    for (let i = 0; i < t.counts.p3; i++) h += `<label class="part3">III.${i + 1}<input inputmode="decimal" placeholder="${APP.fmt(sc.p3, 3)}" value="${ov('p3', i)}" data-ch="scOver" data-id="${t.id}" data-k="p3-${i}"></label>`;
    h += `</div></div><div class="row wrap gap"><button class="btn ghost" data-act="saveTpl" data-id="${t.id}">⭐ Lưu cách tính điểm này làm mẫu</button>${APP.ST.templates.length ? `<select data-ch="useTpl" data-id="${t.id}"><option value="">Dùng mẫu của tôi…</option>${APP.ST.templates.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join('')}</select>` : ''}</div>`;
    return h;
  };
  APP.scoreChanged = function (t, what) {
    const before = APP._scoreBefore || {};
    const after = APP.allGrades(t), changed = [];
    Object.keys(after).forEach(id => { if (before[id] !== after[id]) changed.push({ id, a: before[id], b: after[id] }); });
    t.changedAt = Date.now();
    t.hist.push({ t: Date.now(), text: what + (changed.length ? ` — chấm lại, ${changed.length} phiếu đổi điểm` : '') });
    APP.save(); APP.render();
    if (changed.length) APP.toast(`Đã chấm lại: <b>${changed.length}</b> phiếu đổi điểm${t.exportedAt ? ' · nhớ xuất lại điểm' : ''}`, 'ok');
  };
  APP.withScore = function (t, what, fn) { APP._scoreBefore = APP.allGrades(t); fn(); APP.scoreChanged(t, what); };
  APP.CH.scScale = function (el) { const t = APP.test(el.dataset.id); APP.withScore(t, 'Đổi thang điểm', () => { t.scoring.scale = el.value === 'khac' ? (t.scoring.scale === 10 ? 20 : t.scoring.scale) : +el.value; }); };
  APP.CH.scScaleN = function (el) { const t = APP.test(el.dataset.id), v = APP.num(el.value); if (!v || v <= 0) { APP.toast('Thang điểm phải lớn hơn 0', 'warn'); return; } APP.withScore(t, 'Đổi thang điểm thành ' + APP.fmt(v), () => { t.scoring.scale = v; }); };
  APP.CH.scMode = function (el) { const t = APP.test(el.dataset.id); APP.withScore(t, 'Đổi cách tính: ' + (el.value === 'quy' ? 'quy về thang' : 'cộng điểm từng câu'), () => { t.scoring.mode = el.value; }); };
  APP.CH.scRound = function (el) { const t = APP.test(el.dataset.id); APP.withScore(t, 'Đổi cách làm tròn', () => { t.scoring.round = +el.value; }); };
  APP.parseRule = s => { const a = String(s).trim().split(/[\s;\/|]+/).map(APP.num); return a.length === 4 && a.every(x => x != null && x >= 0) ? a : null; };
  APP.CH.scDef = function (el) {
    const t = APP.test(el.dataset.id), k = el.dataset.k;
    if (k === 'p2') { const r = APP.parseRule(el.value); if (!r) { APP.toast('Phần II cần 4 số: điểm khi đúng 1, 2, 3, 4 ý', 'warn'); return; } APP.withScore(t, 'Đổi điểm Phần II', () => { t.scoring.p2 = r; }); }
    else { const v = APP.num(el.value); if (v == null || v < 0) { APP.toast('Điểm phải là số ≥ 0', 'warn'); return; } APP.withScore(t, 'Đổi điểm Phần ' + (k === 'p1' ? 'I' : 'III'), () => { t.scoring[k] = v; }); }
  };
  APP.CH.scOver = function (el) {
    const t = APP.test(el.dataset.id), k = el.dataset.k, v = el.value.trim();
    APP.withScore(t, 'Đổi điểm câu ' + k.replace('p1-', 'I.').replace('p2-', 'II.').replace('p3-', 'III.').replace(/\.(\d+)$/, (m, d) => '.' + (+d + 1)), () => {
      if (!v) { delete t.scoring.over[k]; return; }
      if (k.startsWith('p2')) { const r = APP.parseRule(v); if (r) t.scoring.over[k] = r; else APP.toast('Cần 4 số cho 1, 2, 3, 4 ý', 'warn'); }
      else { const n = APP.num(v); if (n != null && n >= 0) t.scoring.over[k] = n; else APP.toast('Điểm phải là số', 'warn'); }
    });
  };
  APP.ACT.saveTpl = function (el) {
    APP.modal(`<h3>Lưu mẫu cách tính điểm</h3><label>Tên mẫu<input id="mTplName" placeholder="VD Toán 45 phút" maxlength="40"></label><div class="row end"><button class="btn ghost" data-act="closeModal">Thôi</button><button class="btn" data-act="doSaveTpl" data-id="${el.dataset.id}">Lưu mẫu</button></div>`);

  APP.CH.useTpl = function (el) {

  /* ---------- chia sẻ đáp án ---------- */
  APP.tabShare = function (t) {

  APP.ACT.exportKey = function (el) {

  /* nhận đáp án (từ tệp hoặc mã QR) vào bài t */
  APP.receiveKey = function (t, d) {
    if (!d || d.loai !== 'quet-diem-dap-an' || !d.counts) { APP.toast('Đây không phải đáp án của app', 'bad'); return; }
    APP.confirm('Nhận đáp án «' + esc(d.ten) + '»?', `Có ${Object.keys(d.keys || {}).length} mã đề, cấu trúc ${d.counts.p1}–${d.counts.p2}–${d.counts.p3} câu. Đáp án và cách tính điểm hiện tại của bài sẽ bị thay.`, 'Nhận đáp án', () => {
      APP._scoreBefore = APP.allGrades(t);
      t.counts = { p1: Math.min(40, d.counts.p1 | 0), p2: Math.min(8, d.counts.p2 | 0), p3: Math.min(6, d.counts.p3 | 0) };
      t.scoring = Object.assign(APP.newScoring(), d.scoring || {});
      t.undo = { keys: JSON.parse(JSON.stringify(t.keys)), goc: t.goc, t: Date.now(), what: 'Nhận đáp án' };

  APP.CH.importKey = function (el) {

        if (ci === 1 && si === 3) { sh.edits.p1[5] = 'B'; sh.hist.push({ t: Date.now() - 3e6, text: 'Phần I câu 6: ' + (r.p1[5] || '(trống)') + ' → B' }); }
        S.sheets.push(sh);
      });
    });
    S.next = { cls: 3, test: 4 };
    APP.scanLog = S.sheets.filter(s => s.testId === 't1' && s.classId === 'c1').slice(-4).reverse().map(s => ({ id: s.id, testId: 't1', classId: 'c1' }));
    return S;
  };
  /* Màn quét khi chụp ảnh giới thiệu: vẽ phiếu giả trong khung camera */
  APP.demoCam = function () {
    const box = $('#camBox'), o = $('#camO');
    if (!box || !o) return;
    box.classList.add('live', 'demo-cam');
    const svg = QD.sheetSVG({ lop: '12A', bai: 'Kiểm tra giữa kì I', sbdLen: 2, counts: { p1: 12, p2: 4, p3: 6 }, classCode: 1, testCode: 3 });
    const im = new Image();
    im.onload = () => {
      const bw = o.clientWidth, bh = o.clientHeight; o.width = bw; o.height = bh;
      const cx = o.getContext('2d');
      const g = cx.createLinearGradient(0, 0, bw, bh); g.addColorStop(0, '#6d6250'); g.addColorStop(1, '#3f382d'); cx.fillStyle = g; cx.fillRect(0, 0, bw, bh);
      const sh = bh * 0.86, sw = sh * 210 / 297;
      cx.save(); cx.translate(bw / 2, bh / 2); cx.rotate(-0.05); cx.shadowColor = 'rgba(0,0,0,.45)'; cx.shadowBlur = 24; cx.drawImage(im, -sw / 2, -sh / 2, sw, sh); cx.restore();
      cx.save(); cx.translate(bw / 2, bh / 2); cx.rotate(-0.05);
      const k = sw / 210; cx.fillStyle = '#2a2d35';
      [[0, 1], [1, 0], [2, 3], [3, 2], [4, 1], [5, 0], [6, 2], [7, 3], [8, 1], [9, 0], [10, 2], [11, 3]].forEach(([q, a]) => { const p = QD.LAYOUT.p1[q].b[a]; cx.beginPath(); cx.arc((p[0] - 105) * k, (p[1] - 148.5) * k, QD.R * k * 0.85, 0, 7); cx.fill(); });
      const P = QD.MKC.map(([x, y]) => [(x - 105) * k, (y - 148.5) * k]);
      cx.strokeStyle = '#22c7a9'; cx.lineWidth = 4; cx.fillStyle = 'rgba(34,199,169,.14)'; cx.beginPath(); P.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.closePath(); cx.fill(); cx.stroke();
      P.forEach(p => { cx.beginPath(); cx.arc(p[0], p[1], 7, 0, 7); cx.fillStyle = '#22c7a9'; cx.fill(); });
      cx.restore();
    };
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    APP.hint('HS05 · 8,75 điểm — đổi phiếu tiếp theo', 'ok');
  };
})();

/* QUÉT ĐIỂM — chuyển danh sách lớp và đáp án giữa hai máy bằng MÃ QR.
   Máy tính hiện mã (một hoặc vài mã nối tiếp), điện thoại bật camera quét. Không gửi gì qua mạng.
   Dùng 2 thư viện kèm sẵn: qrcode-generator (tạo mã) và jsQR (đọc mã). */
(function () {
  'use strict';
  const QD = window.QD, APP = window.APP, esc = QD.esc, $ = APP.$;
  const QR = APP.qr = { stream: null, timer: 0, cyc: 0, codes: [], k: 0, got: null, kind: '', onDone: null, cv: null };
  const PART = 480;                       // số ký tự dữ liệu trong mỗi mã: mã vừa phải, camera đọc dễ trên màn hình
  const KIND_NAME = { L: 'danh sách lớp', D: 'đáp án' };

  /* ---------- gói dữ liệu: JSON → nén (nếu máy có) → base64 ---------- */
  const toB64 = b => { let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  const fromB64 = s => { const bin = atob(s), b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; };
  async function pipe(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
  QR.pack = async function (obj, noZip) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (!noZip && window.CompressionStream) {
      try { return 'z' + toB64(await pipe(bytes, new CompressionStream('deflate-raw'))); } catch (e) { }
    }
    return 'j' + toB64(bytes);
  };
  QR.unpack = async function (s) {
    let b = fromB64(s.slice(1));
    if (s[0] === 'z') {
      if (!window.DecompressionStream) throw new Error('nozip');
      b = await pipe(b, new DecompressionStream('deflate-raw'));
    }
    return JSON.parse(new TextDecoder().decode(b));
  };

  /* ---------- vẽ một mã QR thành SVG ---------- */
  QR.svg = function (text) {
    const q = window.qrcode(0, 'M');
    q.addData(text, 'Byte'); q.make();
    const n = q.getModuleCount(), m = 4, N = n + m * 2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="Mã QR"><rect width="${N}" height="${N}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  };

  /* ---------- MÁY TÍNH: hiện mã ---------- */
  QR.show = async function (title, kind, obj, note, noZip) {
    const data = await QR.pack(obj, noZip), id = Math.random().toString(36).slice(2, 6);
    const parts = []; for (let i = 0; i < data.length; i += PART) parts.push(data.slice(i, i + PART));
    QR.codes = parts.map((p, i) => `QD|${kind}|${id}|${i + 1}|${parts.length}|${p}`);
    QR.k = 0; QR.showArgs = [title, kind, obj, note];
    const n = QR.codes.length;
    APP.modal(`<h3>${title}</h3>
      <p class="small">${note} Trên điện thoại: mở app → ${kind === 'L' ? '<b>Lớp</b> → <b>📷 Nhận lớp bằng mã QR</b>' : 'bài kiểm tra → thẻ <b>Chia sẻ</b> → <b>📷 Quét mã QR đáp án</b>'}, rồi hướng camera vào mã dưới đây.</p>
      <div class="qr-show" id="qrShow"></div>
      ${n > 1 ? `<div class="row center gap"><button class="btn ghost sm" data-act="qrPrev">‹</button><span>Mã <b id="qrK">1</b> / ${n}</span><button class="btn ghost sm" data-act="qrNext">›</button>
        <label class="inl small"><input type="checkbox" id="qrAuto" checked> Tự chuyển mã</label></div>
        <p class="mu small">Có ${n} mã nối tiếp. Cứ giữ điện thoại trước màn hình, app tự nhận đủ ${n} mã (thứ tự nào cũng được).</p>` : ''}
      <p class="mu small">Điện thoại báo «không giải nén được»? <a href="#" data-act="qrNoZip">Tạo lại mã không nén</a> (nhiều mã hơn).</p>
      <div class="row end"><button class="btn" data-act="closeModal">Xong</button></div>`, { wide: true, focus: false });
    QR.draw();
    clearInterval(QR.cyc);
    if (n > 1) QR.cyc = setInterval(() => { const a = $('#qrAuto'); if (!$('#qrShow')) { clearInterval(QR.cyc); return; } if (a && a.checked) { QR.k = (QR.k + 1) % n; QR.draw(); } }, 1400);
  };
  QR.draw = function () {
    const b = $('#qrShow'); if (!b) return;
    b.innerHTML = QR.svg(QR.codes[QR.k]);
    const k = $('#qrK'); if (k) k.textContent = QR.k + 1;
  };
  APP.ACT.qrPrev = () => { const a = $('#qrAuto'); if (a) a.checked = false; QR.k = (QR.k - 1 + QR.codes.length) % QR.codes.length; QR.draw(); };
  APP.ACT.qrNext = () => { const a = $('#qrAuto'); if (a) a.checked = false; QR.k = (QR.k + 1) % QR.codes.length; QR.draw(); };
  APP.ACT.qrNoZip = () => { const [t, k, o, n] = QR.showArgs; QR.show(t, k, o, n, true); };

  /* ---------- ĐIỆN THOẠI: quét mã ---------- */
  QR.scan = async function (title, kind, onDone) {
    QR.kind = kind; QR.onDone = onDone; QR.got = null;
    APP.modal(`<h3>${title}</h3>
      <div class="qr-cam"><video id="qrV" playsinline muted autoplay></video><div class="qr-aim"></div><p class="cam-hint" id="qrHint">Đang mở camera…</p></div>
      <div class="row end"><button class="btn ghost" data-act="closeModal">Thôi</button></div>`, { focus: false });
    if (!window.jsQR) { QR.hint('App thiếu phần đọc mã QR. Tải lại trang rồi thử lại.', 'warn'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      QR.hint(location.protocol === 'file:' ? 'Mở từ tệp trên máy thì trình duyệt không cho dùng camera. Mở app qua đường link https.' : 'Trình duyệt này không mở được camera.', 'warn');
      return;
    }
    if (APP.cam && APP.cam.on) APP.cam.stop();
    try {
      QR.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      QR.hint('Chưa mở được camera (' + (e.name === 'NotAllowedError' ? 'chưa cho phép dùng camera — vào Cài đặt › Safari › Camera chọn Cho phép' : esc(e.message)) + ').', 'warn');
      return;
    }
    const v = $('#qrV');
    if (!v) { QR.stop(); return; }
    v.srcObject = QR.stream;
    try { await v.play(); } catch (e) { }
    QR.hint('Hướng camera vào mã QR trên màn hình máy tính');
    QR.loop();
  };
  QR.hint = function (t, kind) { const h = $('#qrHint'); if (h) { h.innerHTML = t; h.className = 'cam-hint ' + (kind || ''); } };
  QR.stop = function () {
    clearTimeout(QR.timer); clearInterval(QR.cyc); QR.timer = 0;
    if (QR.stream) QR.stream.getTracks().forEach(t => t.stop());
    QR.stream = null;
  };
  QR.loop = function () { if (QR.stream) QR.timer = setTimeout(QR.tick, 140); };
  QR.tick = function () {
    const v = $('#qrV');
    if (!QR.stream || !v) { QR.stop(); return; }
    if (v.videoWidth) {
      const sc = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)), w = Math.round(v.videoWidth * sc), h = Math.round(v.videoHeight * sc);
      const cv = QR.cv || (QR.cv = document.createElement('canvas'));
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(v, 0, 0, w, h);
      let code = null;
      try { code = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); } catch (e) { console.warn(e); }
      if (code && code.data && QR.take(code.data)) return;
    }
    QR.loop();
  };
  /* nhận một mã; trả true khi đã đủ và dừng quét */
  QR.take = function (text) {
    const a = text.split('|');
    if (a[0] !== 'QD' || a.length !== 6) { QR.hint('Mã này không phải của app Quét Điểm', 'warn'); return false; }
    const [, kind, id, k, n, data] = a;
    if (kind !== QR.kind) { QR.hint('Đây là mã <b>' + (KIND_NAME[kind] || '?') + '</b>, ở đây cần mã <b>' + KIND_NAME[QR.kind] + '</b>', 'warn'); return false; }
    if (!QR.got || QR.got.id !== id) QR.got = { id, n: +n, parts: {} };
    if (!QR.got.parts[k]) { QR.got.parts[k] = data; APP.beep(true); }
    const have = Object.keys(QR.got.parts).length;
    if (have < QR.got.n) { QR.hint(`Đã nhận <b>${have} / ${QR.got.n}</b> mã — giữ yên máy, chờ máy tính chuyển mã tiếp`, 'ok'); return false; }
    QR.stop();
    let all = ''; for (let i = 1; i <= QR.got.n; i++) all += QR.got.parts[i];
    QR.hint('Đã nhận đủ, đang đọc…', 'ok');
    QR.unpack(all).then(obj => { QR.onDone(obj); }).catch(e => {
      QR.hint(e.message === 'nozip' ? 'Máy này không giải nén được. Trên máy tính bấm «Tạo lại mã không nén» rồi quét lại.' : 'Mã đọc bị lỗi, quét lại giúp em ạ.', 'warn');
      QR.got = null;
    });
    return true;
  };
  /* đóng hộp thoại hoặc chuyển trang thì tắt camera, dừng chuyển mã */
  const closeOld = APP.closeModal;
  APP.closeModal = function () { QR.stop(); closeOld(); };
  window.addEventListener('hashchange', QR.stop);

  /* ---------- DANH SÁCH LỚP ---------- */
  const classData = c => ({ loai: 'quet-diem-lop', v: 1, ten: c.name, sbdLen: c.sbdLen, ds: c.students.map(s => [s.stt, s.sbd || '', s.label || '']) });
  const toList = d => (d.ds || []).map((r, i) => ({ stt: (r[0] | 0) || i + 1, sbd: String(r[1] || ''), label: String(r[2] || '') || ('HS' + String(i + 1).padStart(2, '0')) }));
  APP.ACT.qrShowClass = function (el) {
    const c = APP.cls(el.dataset.id);
    if (!c.students.length) { APP.toast('Lớp chưa có học sinh', 'warn'); return; }
    QR.show('📱 Gửi lớp ' + esc(c.name) + ' sang điện thoại', 'L', classData(c), `Mã gồm tên lớp, độ dài SBD và ${c.students.length} dòng học sinh.`);
  };
  /* quét trong trang một lớp: thay danh sách của lớp đó */
  APP.ACT.qrScanClass = function (el) {
    const c = APP.cls(el.dataset.id);
    QR.scan('📷 Nhận danh sách lớp ' + esc(c.name) + ' bằng mã QR', 'L', d => {
      const list = toList(d);
      const go = () => { if (d.sbdLen >= 2 && d.sbdLen <= 6) c.sbdLen = d.sbdLen; APP.applyList(c, list, false); };
      if (c.students.length) APP.confirm('Thay danh sách lớp ' + esc(c.name) + '?', `Mã có <b>${list.length}</b> học sinh (lớp «${esc(d.ten)}»). Danh sách hiện có ${c.students.length} em sẽ được thay.`, 'Thay danh sách', go);
      else go();
    });
  };
  /* quét ở trang Lớp: tạo lớp mới theo tên trong mã (trùng tên thì hỏi thay) */
  APP.ACT.qrNewClass = function () {
    QR.scan('📷 Nhận lớp bằng mã QR', 'L', d => {
      const list = toList(d), name = String(d.ten || 'Lớp mới').slice(0, 30);
      const old = APP.ST.classes.find(c => c.name.toLowerCase() === name.toLowerCase());
      if (old) {
        APP.confirm('Đã có lớp ' + esc(name), `Mã có <b>${list.length}</b> học sinh. Thay danh sách hiện có (${old.students.length} em) của lớp này?`, 'Thay danh sách', () => {
          if (d.sbdLen >= 2 && d.sbdLen <= 6) old.sbdLen = d.sbdLen;
          APP.applyList(old, list, false); APP.go('lop', { id: old.id });
        });
        return;
      }
      const used = new Set(APP.ST.classes.map(c => c.code));
      let code = APP.ST.next.cls; while (used.has(code) || code < 1 || code > 255) code = code >= 255 ? 1 : code + 1;
      APP.ST.next.cls = code + 1;
      const c = { id: APP.uid(), code, name, sbdLen: (d.sbdLen >= 2 && d.sbdLen <= 6) ? d.sbdLen : 2, students: [], createdAt: Date.now() };
      APP.ST.classes.push(c);
      APP.applyList(c, list, false);
      APP.go('lop', { id: c.id });
    });
  };

  /* ---------- ĐÁP ÁN ---------- */
  APP.ACT.qrShowKey = function (el) {
    const t = APP.test(el.dataset.id);
    if (!Object.keys(t.keys || {}).length) { APP.toast('Bài chưa có đáp án mã đề nào', 'warn'); return; }
    QR.show('📱 Gửi đáp án «' + esc(t.name) + '» bằng mã QR', 'D', APP.keyData(t), `Mã gồm số câu, đáp án ${Object.keys(t.keys).length} mã đề, câu gốc và cách tính điểm — không có danh sách lớp hay điểm.`);
  };
  APP.ACT.qrScanKey = function (el) {
    const t = APP.test(el.dataset.id);
    QR.scan('📷 Nhận đáp án cho bài «' + esc(t.name) + '»', 'D', d => { APP.closeModal(); APP.receiveKey(t, d); });
  };
})();

window.addEventListener('DOMContentLoaded', function () { APP.start(); });
if ('serviceWorker' in navigator) { var _rl = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (_rl) return; _rl = true; if (navigator.serviceWorker.controller && !APP.cam.on) location.reload(); }); }
</script>
